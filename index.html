  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r with logo -->\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 28px 32px; background: #FFFFFF\">\n<img src=\"bc9a7584-9421-46d6-87d3-039f53e81fd2\" alt=\"Manufacturing Summit 2027\" style=\"width: 248px; height: 120px; display: block\">\n<div style=\"text-align: right; font-size: 12px; line-height: 1.5; color: #4A5573\">Santo Domingo,<br>Dominican Republic<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Hero -->\n<div style=\"position: relative; overflow: hidden; background: #131D44; padding: 56px 40px 64px; display: flex; flex-direction: column; gap: 20px\">\n<svg aria-hidden=\"true\" width=\"640\" height=\"200\" sc-camel-view-box=\"0 0 640 200\" style=\"position: absolute; right: 0; top: 0; opacity: 0.9\" fill=\"none\" stroke-linecap=\"round\">\n<path d=\"M180 -10 C 320 60, 420 20, 660 120\" stroke=\"#196297\" stroke-width=\"2\"><\u002Fpath>\n<path d=\"M220 -10 C 350 70, 450 40, 660 145\" stroke=\"#2D89BE\" stroke-width=\"2\"><\u002Fpath>\n<path d=\"M260 -10 C 380 80, 480 60, 660 170\" stroke=\"#8EC1E8\" stroke-width=\"2\"><\u002Fpath>\n<path d=\"M300 -10 C 410 90, 510 80, 660 195\" stroke=\"#FFBD12\" stroke-width=\"3\"><\u002Fpath>\n<path d=\"M340 -10 C 440 100, 540 100, 660 220\" stroke=\"#E8820F\" stroke-width=\"2\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"position: relative; display: inline-flex; align-self: flex-start; padding: 6px 12px; border: 1px solid #FFBD12; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #FFBD12; margin-top: 60px\">Exhibitor invitation<\u002Fdiv>\n<h1 style=\"position: relative; margin: 0; font-size: 40px; line-height: 1.15; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em\">Meet the manufacturers of the Caribbean's nearshoring hub.<\u002Fh1>\n<p style=\"position: relative; margin: 0; font-size: 17px; line-height: 1.6; color: #D5E6F5\">Manufacturing Summit 2027 brings the Dominican Republic's free-zone manufacturers together with the suppliers they buy from. Electronics and, for the first time, medical devices and pharma, all in one day in Santo Domingo.<\u002Fp>\n<div style=\"position: relative; display: flex; gap: 0; margin-top: 8px; border-top: 1px solid #2D3A6B; border-bottom: 1px solid #2D3A6B\">\n<div style=\"flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgb(142, 193, 232)\">Date<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: rgb(255, 189, 18)\">FEBRUARY 2027<\u002Fspan><\u002Fdiv>\n<div style=\"flex: 1; padding: 16px 0 16px 20px; border-left: 1px solid #2D3A6B; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgb(142, 193, 232)\">location<\u002Fspan><span style=\"font-size: 15px; font-weight: 600; color: rgb(255, 189, 18)\">Santo Domingo, Dominican Republic<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<a href=\"https://forms.cloud.microsoft/r/yJL7g4Tdjj\" style=\"position: relative; align-self: flex-start; margin-top: 12px; padding: 16px 28px; background: {{cta}}; color: #131D44; font-size: 16px; font-weight: 700; text-decoration: none; border-radius: 6px\" target=\"_blank\" rel=\"noopener noreferrer\">I want to exhibit<\u002Fa>\n<\u002Fdiv>\n\n<!-- What is it -->\n<div style=\"padding: 48px 40px 40px; display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D96C06\">New to the Summit?<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #131D44\">What is the Manufacturing Summit?<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #2E3857\">It's the meeting point for the manufacturing industry in the Dominican Republic's free zones. The Summit is organized by <strong>ADOZONA<\u002Fstrong>, the Dominican Association of Free Zones, together with its <strong>Electrical and Electronic Devices Cluster (CDEE)<\u002Fstrong> and its <strong>Medical Devices &amp; Pharmaceuticals Cluster<\u002Fstrong>.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #2E3857\">Its participants are the decision-makers behind the country's free-zone manufacturing operations. For international suppliers, it offers direct access to them as nearshoring reshapes where manufacturers do business.<\u002Fp>\n<\u002Fdiv>\n\n<!-- Two industries -->\n<div style=\"padding: 0 40px 48px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"padding: 4px 10px; background: #FFBD12; color: #131D44; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 4px\">New in 2027<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 22px; font-weight: 700; color: #131D44\">Two industries, one trip<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n<div style=\"background: #EEF5FB; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#196297\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1.5\"><\u002Frect><path d=\"M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4\"><\u002Fpath><rect x=\"9.5\" y=\"9.5\" width=\"5\" height=\"5\"><\u002Frect><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Electrical &amp; electronic devices<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Manufacturers in the CDEE cluster, looking for components, materials, equipment and services.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #EEF5FB; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px\">\n<svg aria-hidden=\"true\" width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#196297\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"><\u002Fpath><path d=\"M12 10.5v6M9 13.5h6\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Medical devices &amp; pharmaceuticals<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Joining the Summit for the first time with the Medical Devices &amp; Pharma Cluster and its member companies.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Format -->\n<div style=\"background: #F6F8FB; padding: 48px 40px; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D96C06\">The format<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #131D44\">One day, three ways to connect<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; align-items: flex-start\">\n<span style=\"flex: none; width: 44px; height: 44px; border-radius: 50%; background: #131D44; color: #FFBD12; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700\">1<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 700; color: #131D44\">Trade show with B2B meetings<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3857\">Show your products and services on the floor, and sit down with manufacturers in scheduled business meetings.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; align-items: flex-start\">\n<span style=\"flex: none; width: 44px; height: 44px; border-radius: 50%; background: #131D44; color: #FFBD12; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700\">2<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 700; color: #131D44\">Conferences &amp; panels<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3857\">Talks and panels on the issues shaping both industries, with room for exhibitors to share their expertise.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 20px; align-items: flex-start\">\n<span style=\"flex: none; width: 44px; height: 44px; border-radius: 50%; background: #131D44; color: #FFBD12; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700\">3<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 700; color: #131D44\">Talent fair<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3857\">Engineers, technicians and professionals meet the companies building their careers in the free zones.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 2025 numbers -->\n<div style=\"position: relative; overflow: hidden; background: #131D44; padding: 48px 40px; display: flex; flex-direction: column; gap: 28px\">\n<svg aria-hidden=\"true\" width=\"640\" height=\"120\" sc-camel-view-box=\"0 0 640 120\" style=\"position: absolute; left: 0; bottom: 0\" fill=\"none\" stroke-linecap=\"round\">\n<path d=\"M-20 100 C 160 40, 300 120, 660 60\" stroke=\"#196297\" stroke-width=\"2\"><\u002Fpath>\n<path d=\"M-20 115 C 170 60, 320 135, 660 80\" stroke=\"#2D89BE\" stroke-width=\"2\"><\u002Fpath>\n<path d=\"M-20 130 C 180 80, 340 150, 660 100\" stroke=\"#FFBD12\" stroke-width=\"2.5\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"position: relative; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #FFBD12\">Last edition · February 13–14, 2025<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #FFFFFF\">The 2025 Summit in numbers<\u002Fh2>\n<\u002Fdiv>\n<div style=\"position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 38px; line-height: 1; font-weight: 700; color: #FFBD12\">1,361<\u002Fspan>\n<span style=\"font-size: 13px; line-height: 1.45; color: #D5E6F5\">registered participants<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 38px; line-height: 1; font-weight: 700; color: #FFBD12\">905<\u002Fspan>\n<span style=\"font-size: 13px; line-height: 1.45; color: #D5E6F5\">attended in person<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 38px; line-height: 1; font-weight: 700; color: #FFBD12\">~50%<\u002Fspan>\n<span style=\"font-size: 13px; line-height: 1.45; color: #D5E6F5\">of attendees in management or professional roles<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 38px; line-height: 1; font-weight: 700; color: #8EC1E8\">24<\u002Fspan>\n<span style=\"font-size: 13px; line-height: 1.45; color: #D5E6F5\">exhibitors, 9 of them international<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 38px; line-height: 1; font-weight: 700; color: #8EC1E8\">88<\u002Fspan>\n<span style=\"font-size: 13px; line-height: 1.45; color: #D5E6F5\">talks<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"line-height: 1\"><font color=\"#8ec1e8\" style=\"font-weight: 700\"><span style=\"font-size: 38px\">2<br><\u002Fspan><\u002Ffont><span style=\"color: rgb(213, 230, 245); font-size: 13px; line-height: 1.35\">government alliances (MICM, CNZFE)<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: relative; display: flex; align-items: center; gap: 16px; padding: 20px 24px; margin-bottom: 40px; background: #FFBD12; border-radius: 8px\">\n<span style=\"font-size: 32px; font-weight: 700; color: #131D44; line-height: 1\">1,500+<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.45; font-weight: 500; color: #131D44\">participants expected in 2027, our goal with two industries under one roof.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Who was there -->\n<div style=\"padding: 44px 40px; display: flex; flex-direction: column; gap: 24px; border-bottom: 1px solid #E3E8EF\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #4A5573\">International exhibitors in 2025 included<\u002Fspan>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600; color: #131D44\">UL · Fastenal · Future Electronics<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #4A5573\">Participating companies in 2025 included<\u002Fspan>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600; color: #131D44\">Eaton · Rockwell Automation · Signal Transformers (Bel Fuse) · Fenix Manufacturing<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Why exhibit -->\n<div style=\"padding: 48px 40px; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #D96C06\">Why exhibit<\u002Fspan>\n<h2 style=\"margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #131D44\">Four reasons to be on the floor in 2027<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 3px solid #2D89BE\">\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Meet buyers face to face<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Talk directly with the people who decide purchasing for plants operating in the free zones.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 3px solid #FFBD12\">\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Two industries, one trip<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Reach electrical and electronics manufacturers and medical device and pharma companies in a single day.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 3px solid #E8820F\">\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Take the stage<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Speak on a panel and show the industry what your company knows.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 3px solid #131D44\">\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Build presence in a nearshoring hub<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6;  0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Meet buyers face to face<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Talk directly with the people who decide purchasing for plants operating in the free zones.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 3px solid #FFBD12\">\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Two industries, one trip<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Reach electrical and electronics manufacturers and medical device and pharma companies in a single day.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 3px solid #E8820F\">\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Take the stage<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Speak on a panel and show the industry what your company knows.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 3px solid #131D44\">\n<h3 style=\"margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: #131D44\">Build presence in a nearshoring hub<\u002Fh3>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3857\">Establish your brand in the Dominican Republic, a manufacturing base close to the U.S. market.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<div id=\"exhibit\" style=\"margin: 0 40px 48px; padding: 40px; background: #EEF5FB; border-radius: 10px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start\">\n<h2 style=\"margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700; color: #131D44\">Ready to meet your next customers?<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #2E3857\">Tell us you're interested in exhibiting and our team will get in touch with everything you need to know.<\u002Fp>\n<a href=\"mailto: phernandez@adozona.org\" style=\"margin-top: 4px; padding: 16px 28px; background: #FFBD12; color: #131D44; font-size: 16px; font-weight: 700; text-decoration: none; border-radius: 6px\" target=\"_blank\" rel=\"noopener noreferrer\">Request exhibitor information<\u002Fa>\n\n<\u002Fdiv>\n\n\n<div style=\"position: relative; overflow: hidden; background: #131D44; padding: 40px; display: flex; flex-direction: column; gap: 20px\">\n<svg aria-hidden=\"true\" width=\"640\" height=\"16\" viewBox=\"0 0 640 16\" style=\"position: absolute; left: 0; top: 0\" fill=\"none\">\n<rect x=\"0\" y=\"0\" width=\"160\" height=\"6\" fill=\"#196297\"><\u002Frect>\n<rect x=\"160\" y=\"0\" width=\"160\" height=\"6\" fill=\"#2D89BE\"><\u002Frect>\n<rect x=\"320\" y=\"0\" width=\"160\" height=\"6\" fill=\"#FFBD12\"><\u002Frect>\n<rect x=\"480\" y=\"0\" width=\"160\" height=\"6\" fill=\"#E8820F\"><\u002Frect>\n<\u002Fsvg>\n<p style=\"margin: 0; font-size: 18px; font-weight: 700; color: #FFFFFF\">Manufacturing Summit 2027<\u002Fp>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.6; color: #D5E6F5\">Organized by ADOZONA, the Dominican Association of Free Zones, with its Electrical and Electronic Devices Cluster (CDEE) and Medical Devices &amp; Pharma Cluster. Santo Domingo, Dominican Republic.<\u002Fp>\n<div style=\"height: 1px; background: #2D3A6B\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #A9B6CC\">Organized by<\u002Fspan>\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n<img src=\"4148d5e2-5bc5-4728-b561-3c96e8c3448c\" alt=\"ADOZONA\" style=\"height: 52px; width: auto; display: block; opacity: 0.85\">\n<img src=\"882fd1c4-7f3b-4e76-a925-3ffbb749fe5d\" alt=\"Electrical and Electronic Devices Cluster, Dominican Republic\" style=\"height: 46px; width: auto; display: block; opacity: 0.85\">\n<img src=\"46bbf5ed-f359-4cc3-8335-83aae8b36e81\" alt=\"Medical Devices &amp; Pharmaceutical Cluster, Dominican Republic\" style=\"height: 59px; width: 134px; display: block; opacity: 0.85\">\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;cta&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFBD12&quot;,&quot;options&quot;:[&quot;#FFBD12&quot;,&quot;#E8820F&quot;,&quot;#8EC1E8&quot;]},&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:4060}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { cta: this.props.cta ?? '#FFBD12' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
